AWSTemplateFormatVersion: "2010-09-09"
Description: >
  project-planning

Transform:
  - AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    MemorySize: 128
    Timeout: 100

Resources:
  CreateProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/project/create-project.handler
      Description: Create a new project
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectTable
      Environment:
        Variables:
          PROJECT_TABLE: !Ref ProjectTable
          JIGJOY_API_ENDPOINT: "{{resolve:secretsmanager:vars:SecretString:JigJoyApiEndpoint}}"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/project/create-project.ts

  UpdateProjectDetailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/project/update-project-details.handler
      Description: Update project details
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectTable
      Environment:
        Variables:
          PROJECT_TABLE: !Ref ProjectTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/project/update-project-details.ts

  FetchProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/project/fetch-project.handler
      Description: Fetch a project by id
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectTable
      Environment:
        Variables:
          PROJECT_TABLE: !Ref ProjectTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/project/fetch-project.ts

  FetchProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/project/fetch-projects.handler
      Description: Fetch all projects for an owner
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectTable
      Environment:
        Variables:
          PROJECT_TABLE: !Ref ProjectTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/project/fetch-projects.ts

  ArchiveProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/project/archive-project.handler
      Description: Archive a project
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectTable
      Environment:
        Variables:
          PROJECT_TABLE: !Ref ProjectTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/project/archive-project.ts

  PlanTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/task/plan-tasks.handler
      MemorySize: 256
      Timeout: 120
      Description: Plan tasks using AI for a project
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskTable
      Environment:
        Variables:
          PROJECT_TABLE: !Ref ProjectTable
          TASK_TABLE: !Ref TaskTable
          OPENAI_API_KEY: "{{resolve:secretsmanager:vars:SecretString:OpenAIAPIKey}}"
          ANTHROPIC_API_KEY: "{{resolve:secretsmanager:vars:SecretString:AnthropicAPIKey}}"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/task/plan-tasks.ts

  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/task/create-task.handler
      Description: Create a new task
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskTable
      Environment:
        Variables:
          TASK_TABLE: !Ref TaskTable
          PROJECT_TABLE: !Ref ProjectTable
          OPENAI_API_KEY: "{{resolve:secretsmanager:vars:SecretString:OpenAIAPIKey}}"
          ANTHROPIC_API_KEY: "{{resolve:secretsmanager:vars:SecretString:AnthropicAPIKey}}"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/task/create-task.ts

  UpdateTaskTitleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/task/update-task-title.handler
      Description: Update task title
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskTable
      Environment:
        Variables:
          TASK_TABLE: !Ref TaskTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/task/update-task-title.ts

  UpdateTaskDescriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/task/update-task-description.handler
      Description: Update task description
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskTable
      Environment:
        Variables:
          TASK_TABLE: !Ref TaskTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/task/update-task-description.ts

  FetchTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/task/fetch-tasks.handler
      Description: Fetch tasks for a project
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskTable
      Environment:
        Variables:
          TASK_TABLE: !Ref TaskTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/task/fetch-tasks.ts

  LeaveCommentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/task/leave-comment.handler
      Description: Leave a comment on a task
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskTable
      Environment:
        Variables:
          TASK_TABLE: !Ref TaskTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/task/leave-comment.ts

  RecordWorkFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/task/record-work.handler
      Description: Record work on a task
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TaskTable
      Environment:
        Variables:
          TASK_TABLE: !Ref TaskTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/task/record-work.ts

  ProjectTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Project"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ownerGSI
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: ownerStatusGSI
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TaskTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Task"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: projectGSI
          KeySchema:
            - AttributeName: projectId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

Outputs:
  CreateProjectFunctionArn:
    Value: !GetAtt CreateProjectFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CreateProjectFunctionArn"

  UpdateProjectDetailsFunctionArn:
    Value: !GetAtt UpdateProjectDetailsFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UpdateProjectDetailsFunctionArn"

  FetchProjectFunctionArn:
    Value: !GetAtt FetchProjectFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FetchProjectFunctionArn"

  FetchProjectsFunctionArn:
    Value: !GetAtt FetchProjectsFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FetchProjectsFunctionArn"

  ArchiveProjectFunctionArn:
    Value: !GetAtt ArchiveProjectFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ArchiveProjectFunctionArn"

  PlanTasksFunctionArn:
    Value: !GetAtt PlanTasksFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-PlanTasksFunctionArn"

  CreateTaskFunctionArn:
    Value: !GetAtt CreateTaskFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CreateTaskFunctionArn"

  UpdateTaskTitleFunctionArn:
    Value: !GetAtt UpdateTaskTitleFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UpdateTaskTitleFunctionArn"

  UpdateTaskDescriptionFunctionArn:
    Value: !GetAtt UpdateTaskDescriptionFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UpdateTaskDescriptionFunctionArn"

  FetchTasksFunctionArn:
    Value: !GetAtt FetchTasksFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FetchTasksFunctionArn"

  LeaveCommentFunctionArn:
    Value: !GetAtt LeaveCommentFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LeaveCommentFunctionArn"

  RecordWorkFunctionArn:
    Value: !GetAtt RecordWorkFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RecordWorkFunctionArn"
